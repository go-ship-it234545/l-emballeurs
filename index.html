"use strict";
const W=320,H=216,HUD=24;
const wrap=document.getElementById('wrap'),cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov'),sndBtn=document.getElementById('snd'),menuBtn=document.getElementById('mnu'),apBtn=document.getElementById('apb');

const TOUCH=('ontouchstart' in window)||(typeof matchMedia==='function'&&matchMedia('(pointer:coarse)').matches);
const root=document.getElementById('root'),rotBtn=document.getElementById('rotb');let ROT=false,rotPref=false;
try{rotPref=localStorage.getItem('emballeur_rot')==='1';}catch(e){}
rotBtn.onclick=()=>{rotPref=!rotPref;try{localStorage.setItem('emballeur_rot',rotPref?'1':'0')}catch(e){}resize();};
let lastIW=0,lastIH=0,probe=null;
try{probe=document.createElement('div');probe.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';document.body.appendChild(probe);}catch(e){probe=null;}
function insets(){
  try{const c=getComputedStyle(probe);return{t:parseFloat(c.paddingTop)||0,b:parseFloat(c.paddingBottom)||0};}catch(e){return{t:0,b:0};}
}
function resize(){
  lastIW=innerWidth;lastIH=innerHeight;
  const portrait=innerHeight>innerWidth,tall=TOUCH&&portrait&&!rotPref,sa=insets();
  ROT=TOUCH&&portrait&&rotPref;
  // zone utilisable : on evite l'encoche (haut) et la barre d'accueil (bas) de l'ecran
  const vw=ROT?innerHeight:innerWidth,vh=ROT?innerWidth:innerHeight;
  const aw=ROT?vw-sa.t-sa.b:vw,ah=ROT?vh:vh-sa.t-sa.b;
  if(document.body&&document.body.classList){document.body.classList.toggle('rot',ROT);document.body.classList.toggle('tall',tall);}
  root.style.width=vw+'px';root.style.height=vh+'px';
  root.style.padding=ROT?('0 '+sa.b+'px 0 '+sa.t+'px'):((sa.t+(tall?6:0))+'px 0 '+sa.b+'px 0');
  rotBtn.style.display=TOUCH&&portrait?'block':'none';
  const mg=TOUCH?0:8,w=Math.floor(Math.min(aw-mg,(ah-mg-(tall?6:0))*W/H)),h=Math.floor(w*H/W);
  root.style.justifyContent='center';root.style.alignItems=tall?'flex-start':'center';
  wrap.style.width=w+'px';wrap.style.height=h+'px';wrap.style.fontSize=Math.max(7,w/50)+'px';
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>{setTimeout(resize,60);setTimeout(resize,400);setTimeout(resize,1000);});resize();
const rnd=(a,b)=>a+Math.random()*(b-a), rint=(a,b)=>Math.floor(rnd(a,b+1));

function R(c,x,y,w,h){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);}
function txt(s,x,y,col,align,shadow){
  g.font=FONT;g.textBaseline='top';g.textAlign=align||'left';x=Math.round(x);y=Math.round(y);
  if(shadow){g.fillStyle='#1a1c2c';g.fillText(s,x+1,y+1);}
  g.fillStyle=col||'#f4f4f4';g.fillText(s,x,y);
}

/* ================= MUSIQUE CHIPTUNE (originale) ================= */
let AC=null,master=null,noiseBuf=null,nextT=0,step=0,soundOn=true;
const LEAD=[
 [76,79,84,79,76,79,74,76],[74,79,83,79,74,79,71,74],[72,76,81,76,72,76,71,72],[69,72,77,72,81,79,77,74],
 [81,0,81,79,77,0,72,0],[83,0,83,81,79,0,74,0],[79,0,76,0,71,0,76,79],[81,0,0,76,81,0,84,0]];

const ARP=[[60,64,67],[59,62,67],[57,60,64],[57,60,65],[57,60,65],[59,62,67],[59,64,67],[57,60,64]];
function initAudio(){
  if(AC){if(AC.state!=='running'&&AC.resume)AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=soundOn?0.5:0;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.3,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    nextT=AC.currentTime+0.1;setInterval(sched,40);
    if(AC.state!=='running'&&AC.resume)AC.resume();
  }catch(e){AC=null;}
}
// iPhone / iPad : le son doit etre debloque par un vrai toucher, et relance apres une mise en veille
let audioUnlocked=false;
function unlockAudio(){
  initAudio();if(!AC)return;
  try{
    if(AC.state!=='running'&&AC.resume)AC.resume();
    if(!audioUnlocked){const b=AC.createBuffer(1,1,22050),src=AC.createBufferSource();src.buffer=b;src.connect(AC.destination);src.start(0);audioUnlocked=true;}
  }catch(e){}
}
if(document.addEventListener)['touchstart','touchend','pointerdown','pointerup','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,true));
function tone(type,midi,t,dur,vol,slideTo){
  const o=AC.createOscillator(),a=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(440*Math.pow(2,(midi-69)/12),t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(440*Math.pow(2,(slideTo-69)/12),t+dur);
  a.gain.setValueAtTime(vol,t);a.gain.setValueAtTime(vol,t+dur*0.65);a.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(a);a.connect(master);o.start(t);o.stop(t+dur+0.03);
}
function noise(t,dur,vol,hp){
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),a=AC.createGain();s.buffer=noiseBuf;
  f.type='highpass';f.frequency.value=hp;a.gain.setValueAtTime(vol,t);a.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(a);a.connect(master);s.start(t);s.stop(t+dur+0.02);
}
function sched(){
  if(!AC||AC.state!=='running')return;
  if(nextT<AC.currentTime)nextT=AC.currentTime+0.05;
  const playing=G.state==='world'||G.state==='pack'||G.state==='scan'||G.state==='apt';
  const st=(G.state==='pack'||G.state==='scan'?0.128:0.142);
  while(nextT<AC.currentTime+0.16){
    if(playing){
      const bar=Math.floor(step/16)%8,s=step%16,t=nextT;
      if(s%2===0){
        const n=LEAD[bar][s/2];if(n)tone('square',n,t,st*1.8,0.07);
        tone('triangle',BASS[bar]+((s/2)%2?12:0),t,st*1.7,0.2);
      }
      tone('square',ARP[bar][s%3]+12,t,st*0.8,0.022);
      if(s===0||s===8||s===10)tone('sine',45,t,0.11,0.35,21);
      if(s===4||s===12)noise(t,0.12,0.16,1200);
      if(s%4===2)noise(t,0.03,0.07,6000);
    }
    nextT+=st;step=(step+1)%128;
  }
}
function sfx(k){
  if(!AC||AC.state!=='running')return;const t=AC.currentTime+0.01;
  if(k==='pick'){tone('square',84,t,0.06,0.12);tone('square',91,t+0.06,0.09,0.12);}
  else if(k==='put'){tone('square',79,t,0.07,0.1);}
  else if(k==='good'){tone('square',79,t,0.06,0.1);tone('square',86,t+0.06,0.1,0.1);}
  else if(k==='bad'){tone('sawtooth',52,t,0.22,0.16,45);}
  else if(k==='win'){[72,76,79,84].forEach((n,i)=>tone('square',n,t+i*0.08,0.12,0.13));}
  else if(k==='hit'){noise(t,0.25,0.3,300);tone('sawtooth',48,t,0.3,0.15,33);}
  else if(k==='strike'){[67,63,60,55].forEach((n,i)=>tone('square',n,t+i*0.13,0.16,0.14));}
  else if(k==='bell'){tone('triangle',88,t,0.12,0.25);tone('triangle',84,t+0.14,0.2,0.25);}
}

function person(hx,hy,dir,f,o){
  hx=Math.round(hx);hy=Math.round(hy);
  const r=(c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(hx+x,hy+y,w,h);};
  const SKIN=o.skin||SKIN0,EYE=o.eye||'#1a1c2c';
  r('rgba(0,0,0,.28)',3,14,10,2);
  if(o.robot){r('#566c86',7,-2,2,2);r('#ff7a6b',7,-3,2,1);}
  // jambes
  r('#29366f',5,12,2,f===1?2:3);r('#29366f',9,12,2,f===2?2:3);
  r('#1a1c2c',5,f===1?13:14,2,1);r('#1a1c2c',9,f===2?13:14,2,1);
  // corps
  r(o.apron==='#1a1c2c'?'#566c86':'#1a1c2c',3,6,10,7);r(o.shirt,4,7,8,5);if(o.vest){r('#ffcd75',4,9,8,1);r('#ffcd75',4,11,8,1);}
  if(o.apron){
    if(dir===0){r(o.apron,5,8,6,5);r('#f4f4f4',7,10,2,1);r('#b13e53',9,8,1,1);}
    else if(dir===1){r(o.apron,5,7,1,5);r(o.apron,10,7,1,5);r(o.apron,5,10,6,1);}
    else r(o.apron,dir===3?7:4,8,5,5);
  }
  if(dir<2){r(SKIN,3,8+(f===1?1:0),1,3);r(SKIN,12,8+(f===2?1:0),1,3);}
  else r(SKIN,dir===3?8+(f===1?1:f===2?-1:0):7+(f===1?-1:f===2?1:0),9,1,3);
  // tete
  r('#1a1c2c',3,0,10,8);r(SKIN,4,1,8,6);
  if(dir===0){r(o.hair,4,1,8,2);r(EYE,6,4,1,2);r(EYE,9,4,1,2);if(o.cap){r(o.cap,4,1,8,2);r(o.cap,4,3,8,1);}}
  else if(dir===1){r(o.hair,4,1,8,5);if(o.cap)r(o.cap,4,1,8,2);}
  else if(dir===3){r(o.hair,4,1,8,2);r(o.hair,4,3,2,3);r(EYE,10,4,1,2);if(o.cap){r(o.cap,4,1,8,2);r(o.cap,11,3,3,1);}}
  else{r(o.hair,4,1,8,2);r(o.hair,10,3,2,3);r(EYE,5,4,1,2);if(o.cap){r(o.cap,4,1,8,2);r(o.cap,2,3,3,1);}}
}

function spawnCart(){

  const c=opts[rint(0,opts.length-1)],used=carts.filter(k=>k.c===c).map(k=>k.slot);let sl=0;while(used.indexOf(sl)>=0)sl++;
  carts.push({x:CORRALS[c].x+7+(sl%3)*9,y:CORRALS[c].y+14+Math.floor(sl/3)*13,c,slot:sl});
}

function updStock(dt){

  for(const q of SEGS){
    if(q.stock>0)q.empty=0;
    else if(G.brk<=0){q.empty+=dt;if(q.empty>30/DF()){q.empty=0;q.stock=2;strike('TABLETTE VIDE TROP LONGTEMPS!');if(G.strikes>=3){gameOver();return true;}}}
  }
  if(G.room===2){
    for(let c=0;c<3;c++)if(Hh.box!==c&&Math.hypot(Hh.x-PALS[c].x,Hh.y-PALS[c].y)<10){Hh.box=c;sfx('pick');say(Hh.x,Hh.y-34,'BOITE '+CATS[c].n,CATS[c].c);}
  }else if(G.room===0&&Hh.box!=null){
    let best=null;
    for(const q of SEGS){const cx=q.i0*16+32,cy=q.j*16+8;
      if(q.cat===Hh.box&&q.stock<=2&&Math.abs(Hh.x-cx)<36&&Math.abs(Hh.y-4-cy)<22&&(!best||q.stock<best.stock))best=q;}
    if(best){add(10*(4-best.stock)+(best.stock===0?10:0),best.i0*16+32,best.j*16-8,'TABLETTE REMPLIE!','pack');best.stock=4;best.empty=0;Hh.box=null;sfx('good');}
  }
  return false;
}
function moveBot(b,tx,ty,dt){
  const sp=60*dt;let moved=false;
  if(Math.abs(b.x-tx)>0.5){
    if(b.y<170.5){b.y=Math.min(171,b.y+sp);b.dir=0;}
    else{const d=tx-b.x;b.x+=Math.sign(d)*Math.min(sp,Math.abs(d));b.dir=d>0?3:2;}
    moved=true;
  }else if(Math.abs(b.y-ty)>0.5){const d=ty-b.y;b.y+=Math.sign(d)*Math.min(sp,Math.abs(d));b.dir=d>0?0:1;moved=true;}
  if(moved){b.ft+=dt;b.f=1+Math.floor(b.ft*7)%2;}else b.f=0;
  return !moved;
}
function startCarry(c){
  const p=parked.length?parked[rint(0,parked.length-1)]:{x:160,y:131};
  G.carry={t:45,cx:p.x,cy:p.y+18,top:p.y,look:{shirt:c.shirt,hair:c.hair},fx:Hh.x-12,fy:Hh.y,ff:0,fd:0,mv:false};

function updCarry(dt){
  const k=G.carry;if(!k)return;if(G.brk<=0)k.t-=dt;
  const dx=Hh.x-k.fx,dy=Hh.y-k.fy,d=Math.hypot(dx,dy);
  if(d>60){k.fx=Hh.x;k.fy=Hh.y;k.mv=false;}
  else if(d>13){k.fx+=dx/d*72*dt;k.fy+=dy/d*72*dt;k.ff+=dt;k.fd=Math.abs(dx)>Math.abs(dy)?(dx>0?3:2):(dy>0?0:1);k.mv=true;}
  else k.mv=false;
  if(G.room===1&&!G.tr&&Math.hypot(Hh.x-k.cx,Hh.y-(k.cy+12))<16){add(60,Hh.x,Hh.y-26,'SACS LIVRES!','carts');sfx('win');G.carry=null;}
  else if(k.t<=0){add(-10,Hh.x,Hh.y-26,'TROP LENT!','carts');sfx('bad');G.carry=null;}
}
function updBots(dt){
  for(const b of bots){
    if(b.state==='idle'){
      let best=-1,bp=2;
      for(let i=0;i<3;i++){const c=ques[i][0];if(c&&!c.bot&&!c.lock&&c.pat<bp&&!(G.job===1&&i===1)){bp=c.pat;best=i;}}
      if(best>=0){b.ci=best;ques[best][0].bot=b;b.state='go';}
      else if(moveBot(b,b.hx,171,dt))b.dir=0;
    }else if(b.state==='go'){
      const c=ques[b.ci][0];
      if(!c||c.bot!==b){b.state='idle';b.ci=-1;continue;}
      if(moveBot(b,(CAISSE[b.ci]+1)*16+8,155,dt)){b.state='bag';b.tm=0;c.lock=true;b.dir=2;}
    }else{
      b.tm+=dt;b.f=1+Math.floor(b.tm*6)%2;
      if(b.tm>=BOTTIME*DF()){ques[b.ci].shift();G.served++;if(G.room===0)add(15,b.x,b.y-28,'COLLEGUE','pack');else{const v=Math.round(150*(1+0.2*G.rank));G.score+=v;G.packPts+=v;}b.state='idle';b.ci=-1;b.f=0;}
    }
  }
  for(const w of walkers){
    if(w.wait>0){w.wait-=dt;continue;}
    w.x+=w.v*dt;w.ft+=dt;
    if(w.x<24||w.x>296){w.v=-w.v;w.x=Math.min(296,Math.max(24,w.x));}
    else if(Math.random()<dt*0.12)w.wait=rnd(1,3);
  }
}
function updWorld(dt){

      cars.push({x:l.dir>0?-20:340,y:l.y+(Math.random()<0.5?8:24),v:(48+rnd(0,26)+G.day*3)*l.dir*Math.sqrt(DF()),c:CARCOL[rint(0,6)]});}

  G.state='pack';target=null;fx=[];

  P={ci:i,queue:[],belt:[],bags:[{items:[],leave:0},{items:[],leave:0},{items:[],leave:0}],total:n,done:0,pat:1,
     patTime:(n*Math.max(2.2,3.7-(G.day-1)*0.2)+7)/DF(),v:44+G.day*4,spawnT:0,drag:null,phase:'play',tm:0,off:0,result:''};
  for(let k=0;k<n;k++)P.queue.push(Object.assign({},ITEMS[rint(0,ITEMS.length-1)]));
}
function place(bi,it){
  const bag=P.bags[bi],below=bag.items;let pts=10,m='',bad=false;
  if(it.w===3){
    const fr=below.filter(b=>b.w===1&&!b.crushed);
    if(fr.length){fr.forEach(b=>b.crushed=true);pts-=15*fr.length;m='ECRASE!';bad=true;}
    else if(below.every(b=>b.w===3)){pts+=5;m='BONNE BASE';}
  }
  if(it.w===1&&below.length){pts+=5;m='FRAGILE OK';}
  const hasClean=below.some(b=>b.clean),hasFood=below.some(b=>!b.clean);
  if((it.clean&&hasFood)||(!it.clean&&hasClean)){pts-=10;m='SAVON+BOUFFE!';bad=true;}
  if(it.cold&&below.some(b=>b.cold)){pts+=5;if(!bad)m='FROID ENSEMBLE';}
  bag.items.push(it);P.done++;add(pts,BX[bi],BTOP-12,m,'pack');sfx(bad?'bad':pts>10?'good':'put');
  if(bag.items.length>=CAP)bag.leave=0.5;
}

  for(const b of P.bags)if(b.leave>0){b.leave-=dt;if(b.leave<=0){b.items=[];b.leave=0;}}

}

  if(S.phase!=='play'||S.book)return;const it=S.items[S.idx];if(!it)return;
  if(it.code){say(96,112,'ENTRE LE CODE!','#ff7a6b');sfx('bad');}else{sfx('pick');scanNext(10,'BIP');}

function scanKey(k){
  if(S.phase!=='play')return;
  if(k==='c'||k==='CARNET'){S.book=!S.book;return;}
  if(S.book){if(k==='a'||k==='<')S.page=(S.page+NP-1)%NP;else if(k==='d'||k==='>')S.page=(S.page+1)%NP;else if(k==='FERMER')S.book=false;return;}
  if(k===' '||k==='SCAN')return scanDo();
  if(k.length===1&&k>='0'&&k<='9'){if(S.code.length<4){S.code+=k;sfx('put');}return;}
  if(k==='C'){S.code='';return;}
  if(k==='Backspace'){S.code=S.code.slice(0,-1);return;}
  if(k==='OK'||k==='Enter'){
    const it=S.items[S.idx];if(!it)return;
    if(!it.code){say(96,112,'SCANNE-LE!','#ff7a6b');S.code='';return;}
    if(S.code===it.code){sfx('good');scanNext(25,'BON CODE');}
    else{S.code='';add(-10,96,112,'MAUVAIS CODE','pack');sfx('bad');}
  }
}

function aptShop(){

function buyApt(i){
  const c=TIERS[i].p-(G.apt?TIERS[G.apt.tier].p:0);if(G.score<c||(G.apt&&i<=G.apt.tier))return;
  G.score-=c;G.apt={tier:i,items:G.apt?G.apt.items:[]};save();sfx('win');enterApt();
}
function aptAt(i,j,flat){return G.apt.items.find(it=>{const d=fdef(it.k);return d&&!!d.flat===!!flat&&i>=it.i&&i<it.i+d.w&&j>=it.j&&j<it.j+d.h;});}
function aptClick(p){
  const t=TIERS[G.apt.tier],ox=(W-t.w*16)/2;
  if(p.y>=170){
    if(p.y<192){if(p.x>4&&p.x<26)A.sel=(A.sel+FURN.length-1)%FURN.length;else if(p.x>28&&p.x<50)A.sel=(A.sel+1)%FURN.length;else if(p.x>180&&p.x<262)A.mode=1-A.mode;}
    else if(p.y>194){if(p.x>80&&p.x<168)aptShop();else if(p.x>174&&p.x<246){save();A.back();}}
    return;
  }
  const i=Math.floor((p.x-ox)/16),j=Math.floor((p.y-HUD)/16);
  if(i<1||j<1||i>t.w-2||j>t.h-2)return;
  if(A.mode===1){
    const it=aptAt(i,j,false)||aptAt(i,j,true);
    if(it){G.apt.items.splice(G.apt.items.indexOf(it),1);const r=Math.floor(fdef(it.k).p/2);G.score+=r;save();sfx('put');say(p.x,p.y-10,'VENDU +'+r,'#ffcd75');}
    return;
  }
  const d=FURN[A.sel];
  if(i+d.w-1>t.w-2||j+d.h-1>t.h-2){say(p.x,p.y-10,'PAS DE PLACE','#ff7a6b');return;}
  for(let a=0;a<d.w;a++)for(let b=0;b<d.h;b++)if(aptAt(i+a,j+b,!!d.flat)){say(p.x,p.y-10,'CASE OCCUPEE','#ff7a6b');sfx('bad');return;}
  if(G.score<d.p){say(p.x,p.y-10,'PAS ASSEZ DE POINTS','#ff7a6b');sfx('bad');return;}
  G.score-=d.p;G.apt.items.push({k:d.k,i,j});save();sfx('good');say(p.x,p.y-10,'-'+d.p,'#a7f070');
}
function updApt(dt){
  const t=TIERS[G.apt.tier],m=Math.hypot(kx,ky);

    A.dir=Math.abs(kx)>Math.abs(ky)?(kx>0?3:2):(ky>0?0:1);A.ft+=dt;A.f=1+Math.floor(A.ft*7)%2;}else A.f=0;
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(G.state==='world'){updWorld(dt);if(G.state==='world')drawWorld();}
  if(G.state==='pack'){updPack(dt);if(G.state==='pack')drawPack();}
  if(G.state==='scan'){updScan(dt);if(G.state==='scan')drawScan();}
  if(G.state==='apt'){updApt(dt);drawApt();drawFx(dt);}
  if(G.state==='world'||G.state==='pack'||G.state==='scan'){drawHud();drawFx(dt);if(!G.won&&G.score>=GOAL)win();}
  if(innerWidth!==lastIW||innerHeight!==lastIH)resize();
  const showPad=TOUCH&&(G.state==='world'||G.state==='apt');
  if(pad.style.display!==(showPad?'block':'none')){pad.style.display=showPad?'block':'none';if(!showPad&&padOn)padEnd();}
  const hideAp=G.state==='pack'||G.state==='scan'||G.state==='apt'||G.state==='aptshop'||G.state==='pause'||G.state==='over';
  if(apBtn.style.display!==(hideAp?'none':''))apBtn.style.display=hideAp?'none':'';
  requestAnimationFrame(loop);
}

  G.state='menu';
  show('<h2>JOUR '+G.day+' - CHOISIS TON POSTE</h2><p>'+rn(G.rank,G.base)+'</p><button id="j0">EMBALLEUR</button><br><button id="j1">CAISSIER</button>'+(G.rank>=2?'<br><button id="j2">STOCKAGE</button>':'')+'<p>Tu peux changer de poste dans le MENU pendant le quart.</p>');
  [0,1,2].forEach(j=>{const b=$('j'+j);if(b&&b.style)b.onclick=()=>{initAudio();G.job=j;startDay();};});
}
function startGame(i,base,noStart){
  const v=loadSlot(i)||{day:1,score:0,rank:0,base:base?1:0,b3:0,b15:0};
  G.slot=i;G.day=v.day;G.score=v.score||0;G.rank=Math.min(3,v.rank||0);G.base=v.base?1:0;G.won=!!v.won;G.b3=v.b3||0;G.b15=v.b15||0;G.cartN=v.carts==null?3:Math.min(11,v.carts);G.apt=(v.apt&&Array.isArray(v.apt.items))?v.apt:null;cartT=CARTINT;save();if(!noStart)beginDay();
}
function help(){
  show('<h2>COMMENT JOUER</h2><p class="hl"><b>COMMANDES</b> — W A S D pour bouger. Sur un écran tactile : manette ronde en bas à gauche, ou garde le doigt appuyé où tu veux aller ; garde le doigt sur SCAN pour scanner à la chaîne. MENU ou Échap : pause, boutique et difficulté. M : couper le son.</p><div class="cols"><div class="col"><b>— EMBALLEUR —</b><br><b>EMBALLER</b> : quand un client attend, une case jaune clignote au bout de la caisse. Marche dessus. Glisse chaque article du tapis dans un sac (4 par sac). Lourd en bas, fragile sur le dessus, froid ensemble, savon jamais avec la nourriture. ENVOYER vide un sac. Finis avant la fin de la barre PATIENCE.<br><b>PANIERS</b> : sors par la porte du bas (tu mets ton gilet orange). Prends les paniers dans les deux enclos, 5 au maximum, traverse la voie sans te faire frapper et ramène-les au RETOUR. Quand le gérant crie « VA FAIRE LES PANIERS! », ramène-les tous avant la fin du temps.<br><b>AUTO</b> : si un client le demande, suis la flèche ICI et arrête-toi derrière son auto.<br><b>LIVRAISON</b> (rare) : touche le panier bleu demandé (1, 2 ou 3) dans le coin en bas à gauche du magasin, emballe la commande, puis porte-la au DÉPÔT par la porte du haut.</div><div class="col"><b>— CAISSIER —</b><br><b>TA CAISSE</b> : celle du milieu. Marche sur la case qui clignote derrière.<br><b>CODE-BARRES</b> : ESPACE (garde enfoncé pour aller vite) ou clique SCAN.<br><b>FRUIT OU LÉGUME</b> : tape le code à 4 chiffres, puis ENTRÉE. Retour arrière efface.<br><b>CARNET</b> : touche C pour voir les codes, A et D pour tourner les pages.<br><b>TEMPS</b> : chaque article a son propre temps, 3,5 s pour scanner et 15 s pour un code. Trop lent : -50. Mauvais code : -100.<br>Le caissier fait seulement la caisse : pas de paniers, pas de sacs, pas de livraison. Reste sur ta case et les clients se suivent. La BOUTIQUE reste ouverte par MENU.</div></div><p class="hl"><b>STOCKAGE</b> — Les tablettes se vident. Dans l\'arrière-boutique (porte du haut), touche la palette de la bonne couleur (rouge, jaune ou bleue) pour prendre une boîte, puis marche à côté d\'une tablette de cette couleur à moitié vide ou VIDE. Tablette vide plus de 30 s : avertissement.<br><b>POSTES</b> — Dès le rang EMBALLEUR ET CAISSIER, tu choisis ton poste à chaque quart et tu peux en changer dans le MENU.</p><p class="hl"><b>RISQUES</b> — Client non servi : -100 et un avertissement. 3 avertissements dans le même quart : viré, partie effacée.<br><b>BUT</b> — Atteins 10 000 000 de points pour finir le jeu.<br><b>APPARTEMENT</b> — Petit bouton APPART à côté de MENU : achète un logement avec tes points, puis place des meubles (clique une case). VENDRE rend 50 %.<br><b>BOUTIQUE</b> — Pause 3 min : 3 000. Pause 15 min : 15 000. Promotions : Emballeur et caissier 100 000, Stockage 100 000, Gérant 1 000 000 (+20 % de points par rang). La partie se sauvegarde à la fin de chaque quart.</p><button id="bk">RETOUR</button>');
  $('bk').onclick=menu;
}
function summary(){G.state='summary';G.endDay=G.day;G.day++;G.cartN=carts.length+Hh.train;save();showSummary();}
function showSummary(){
  const tot=G.packPts+G.cartPts,st=tot>=4500?3:tot>=2500?2:1;
  show('<h2>FIN DU QUART - JOUR '+G.endDay+'</h2><div class="stars">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</div>'+
  '<table><tr><td>Clients servis</td><td>'+G.served+'</td></tr><tr><td>Clients non servis</td><td>'+G.lost+' (-'+fmt(G.lost*100)+')</td></tr><tr><td>Caisse, sacs, tablettes</td><td>'+fmt(G.packPts)+'</td></tr><tr><td>Paniers et sacs</td><td>'+fmt(G.cartPts)+'</td></tr><tr><td>Tes points</td><td>'+fmt(G.score)+'</td></tr><tr><td>Rang</td><td>'+rn(G.rank,G.base)+'</td></tr></table>'+
  '<p>Partie '+G.slot+' sauvegardée.</p><button id="go">JOUR SUIVANT</button><br><button id="sh" class="quit">BOUTIQUE</button> <button id="qu" class="quit">QUITTER</button>');
  $('go').onclick=()=>{initAudio();beginDay();};$('sh').onclick=()=>shop(showSummary);$('qu').onclick=menu;
}
function gameOver(){
  G.state='over';saveBest();
  const d=G.day,pts=G.score,rk=rn(G.rank,G.base);
  try{localStorage.removeItem('emballeur_save_'+G.slot)}catch(e){}
  G.day=1;G.score=0;G.rank=0;G.base=0;G.won=false;G.apt=null;G.b3=0;G.b15=0;G.strikes=0;
  show('<h1>VIRÉ!</h1><p>Trois avertissements dans le même quart.<br>La partie '+G.slot+' est effacée : tu recommences à zéro.</p>'+
  '<table><tr><td>Jour atteint</td><td>'+d+'</td></tr><tr><td>Points perdus</td><td>'+fmt(pts)+'</td></tr><tr><td>Rang perdu</td><td>'+rk+'</td></tr></table>'+
  '<button id="go">RECOMMENCER</button>');
  $('go').onclick=menu;
}

/* ================= CONTROLES ================= */
function pos(e){const r=cv.getBoundingClientRect();
  if(ROT)return{x:(e.clientY-r.top)/r.height*W,y:(1-(e.clientX-r.left)/r.width)*H};
  return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();const p=pos(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(G.state==='pack'&&P.phase==='play'){
    for(let i=0;i<3;i++){const b=P.bags[i];if(Math.abs(p.x-BX[i])<34&&p.y>192&&b.items.length&&!b.leave){b.leave=0.5;sfx('put');return;}}
    let best=null,bd=20;
    for(const it of P.belt){const d=Math.hypot(it.x-p.x,BELTY-p.y);if(d<bd){bd=d;best=it;}}
    if(best)P.drag={it:best,x:p.x,y:p.y};
  }else if(G.state==='scan'){scanClick(p);scanHold=inScanBtn(p)?0.35:-1;
  }else if(G.state==='apt'){aptClick(p);
  }else if(G.state==='world'&&!G.tr){target={x:p.x,y:p.y-HUD};}
});
cv.addEventListener('pointermove',e=>{
  const p=pos(e);
  if(G.state==='pack'&&P&&P.drag){P.drag.x=p.x;P.drag.y=p.y;}
  else if(G.state==='world'&&target){target={x:p.x,y:p.y-HUD};}
});
function up(){
  scanHold=-1;
  if(G.state==='pack'&&P&&P.drag){
    const d=P.drag;P.drag=null;
    if(P.phase==='play'&&d.y>86){
      for(let i=0;i<3;i++){const b=P.bags[i];
        if(Math.abs(d.x-BX[i])<46&&!b.leave&&b.items.length<CAP){const k=P.belt.indexOf(d.it);if(k>=0){P.belt.splice(k,1);place(i,d.it);}return;}
      }
    }
  }
  target=null;
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
const keys={};let padOn=false,padx=0,pady=0;
function setKeys(){if(padOn){kx=padx;ky=pady;return;}kx=(keys.d?1:0)-(keys.a?1:0);ky=(keys.s?1:0)-(keys.w?1:0);}
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(k.startsWith('Arrow')||k===' '||(G.state==='scan'&&(k==='Backspace'||k==='Enter')))e.preventDefault();keys[k]=true;setKeys();if(G.state==='scan'&&(!e.repeat||k===' '))scanKey(k);if(k==='m'&&!e.repeat)sndBtn.onclick();if((k==='Escape'||k==='p')&&!e.repeat)menuBtn.onclick();});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;setKeys();});

const pad=document.getElementById('pad'),knob=document.getElementById('knob');
if(TOUCH&&document.body&&document.body.classList)document.body.classList.add('touch');
function padMove(e){
  e.preventDefault();const r=pad.getBoundingClientRect(),sx=e.clientX-(r.left+r.width/2),sy=e.clientY-(r.top+r.height/2),dx=ROT?sy:sx,dy=ROT?-sx:sy,d=Math.hypot(dx,dy),mx=r.width/2-18;
  if(d>10){padx=dx/d;pady=dy/d;}else{padx=pady=0;}
  const k=Math.min(d,mx)/(d||1);knob.style.transform='translate('+dx*k+'px,'+dy*k+'px)';
  padOn=true;target=null;setKeys();
}
function padEnd(){padOn=false;padx=pady=0;knob.style.transform='';setKeys();}
pad.addEventListener('pointerdown',e=>{initAudio();try{pad.setPointerCapture(e.pointerId)}catch(_){}padMove(e);});
pad.addEventListener('pointermove',e=>{if(padOn)padMove(e);});
pad.addEventListener('pointerup',padEnd);pad.addEventListener('pointercancel',padEnd);
function boot(){buildRooms();menu();requestAnimationFrame(loop);}
let booted=false;const go=()=>{if(!booted){booted=true;boot();}};
try{document.fonts.load(FONT).then(go,go);}catch(e){}
setTimeout(go,1500);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
